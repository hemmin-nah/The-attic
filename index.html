<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#141c2b">
  <meta name="description" content="Un pequeño hogar pixelado para tus películas, libros, juegos, aficiones y recuerdos.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Attic">
  <link rel="icon" type="image/png" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>The Attic · Tu pequeño universo</title>
</head>
<body data-theme="manhattan">
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" id="brandHome" aria-label="Volver a mi ático">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="brand-copy"><strong>THE ATTIC</strong><small>UN PEQUEÑO UNIVERSO</small></span>
      </button>
      <button class="icon-button" id="openSettings" aria-label="Personalizar y ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v3m0 14v3M4.93 4.93l2.12 2.12m9.9 9.9 2.12 2.12M2 12h3m14 0h3M4.93 19.07l2.12-2.12m9.9-9.9 2.12-2.12"/><circle cx="12" cy="12" r="4"/></svg></button>
    </header>
    <main id="page" tabindex="-1" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Secciones principales">
      <button class="tab active" data-tab="home" aria-label="Mi ático"><span class="tab-icon" aria-hidden="true">⌂</span><span>MI ÁTICO</span></button>
      <button class="tab" data-tab="library" aria-label="Mi colección"><span class="tab-icon" aria-hidden="true">▤</span><span>COLECCIÓN</span></button>
      <button class="tab" data-tab="window" aria-label="Mirar por la ventana"><span class="tab-icon" aria-hidden="true">▦</span><span>VENTANA</span></button>
      <button class="tab" data-tab="settings" aria-label="Personalizar habitación"><span class="tab-icon" aria-hidden="true">✦</span><span>MI MUNDO</span></button>
    </nav>
  </div>
  <div id="overlay" class="overlay-layer" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./pixel-world.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
