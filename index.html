<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1a2030">
  <meta name="description" content="The Attic: un universo pixel art para guardar películas, libros, juegos, manga, cómics, hobbies y recuerdos.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Attic">
  <link rel="icon" type="image/png" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>The Attic · Pixel Worlds</title>
</head>
<body data-theme="manhattan">
  <div class="app-shell">
    <header class="topbar">
      <button id="brandHome" class="brand" aria-label="Volver al ático">
        <span class="brand-logo" aria-hidden="true"></span>
        <span class="brand-copy">
          <strong>THE ATTIC</strong>
          <small>pixel worlds</small>
        </span>
      </button>
      <button id="quickAdd" class="icon-btn" aria-label="Añadir">＋</button>
    </header>

    <main id="page" class="page" tabindex="-1" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Navegación principal">
      <button class="tab active" data-view="home"><span>⌂</span><small>ÁTICO</small></button>
      <button class="tab" data-view="journal"><span>✎</span><small>DIARIO</small></button>
      <button class="tab" data-view="window"><span>▣</span><small>VENTANA</small></button>
      <button class="tab" data-view="world"><span>✦</span><small>MUNDO</small></button>
    </nav>
  </div>

  <div id="overlay" class="overlay hidden" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./pixel-world.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
